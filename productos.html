<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - Farmacia Beniana</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navegación -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand text-success fw-bold" href="index.html">➕ Farmacia Beniana</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link active" href="productos.html">Productos</a></li>
                </ul>
                <div class="d-flex">
                    <button class="btn btn-outline-success" data-bs-toggle="modal" data-bs-target="#modalCarrito">
                    
                        🛒 Carrito (<span class="contador-carrito">0</span>)
                    </button>
                </div>
            </div>
            <button class="btn btn-outline-success btn-sm d-lg-none"
                    data-bs-toggle="modal"
                    data-bs-target="#modalCarrito">
                🛒 Carrito (<span class="contador-carrito">0</span>)
            </button>
        </div>
    </nav>

    <div class="container">
        <!-- BOTÓN PARA REGRESAR AL INICIO -->
        <div class="mb-4">
            <a href="index.html" class="btn btn-secondary">⬅️ Regresar al Inicio</a>
        </div>

        <!-- Buscador -->
        <div class="row mb-4">
            <div class="col-md-8 mx-auto">
                <input type="text" id="buscador" class="form-control form-control-lg border-success" placeholder="🔍 Buscar medicamento (ej. Ibuprofeno, Dermatel...)">
            </div>
        </div>

        <!-- Contenedor de Productos -->
        <div class="row" id="lista-productos">
            <!-- Los productos se cargarán aquí desde JavaScript -->
        </div>
    </div>

    <!-- Modal del Carrito -->
    <div class="modal fade" id="modalCarrito" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title">Tu Carrito de Compras</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="cuerpo-carrito">
                    <p class="text-center text-muted">El carrito está vacío.</p>
                </div>
                <div class="modal-footer d-flex justify-content-between">
                    <h5 class="mb-0">Total: Bs <span id="total-carrito">0.00</span></h5>
                    <button type="button" class="btn btn-success" onclick="enviarWhatsApp()">Comprar por WhatsApp 💬</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="productos.js"></script>
</body>
</html>
